<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Signup Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <form>
        <h2>Signup Form</h2>
        
        <div class="form-group">
            <label for="user">Full Name:</label>
            <input type="text" id="user" placeholder="Enter Your Name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Your Email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter Your Password" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" placeholder="Enter Your Phone Number">
        </div>
        
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter Your Age">
        </div>
        
        <div class="form-group">
            <label for="subject">Subject:</label>
            <select id="subject">
                <option value="">Choose Option</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="class">Class:</label>
            <input type="text" id="class" list="classList">
            <datalist id="classList">
                <option value="10th">
                <option value="12th">
            </datalist>
        </div>
        
        <div class="form-group">
            <label for="File">Upload File:</label>
            <input type="file" id="File" accept=".jpg, .jpeg, .png">
        </div>
        
        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" placeholder="Enter Your Address"></textarea>
        </div>
        
        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
