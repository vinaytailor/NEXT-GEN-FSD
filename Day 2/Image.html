<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image || Link</title>
</head>
<body>
    <img src="https://www.shutterstock.com/image-vector/panda-teddy-bear-bamboo-illustration-600w-2409126125.jpg" alt="Panda Teddy Bear" height="300px"><br>

    <!-- HyperLink : anchor tag -->
        <!-- absolute URL -->
    <a href="https://www.google.com" target="_blank">Google</a><br>

        <!-- relative URL -->
    <a href="List.html" target="_blank">List</a>
</body>
</html>
