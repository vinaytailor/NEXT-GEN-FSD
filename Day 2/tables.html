<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="1">
        <caption>Student Information</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Roll No.</th>
            </tr>
         </thead>
         <tbody>
            <tr>
                <td>Ram</td>
                <td>20</td>
                <td>65</td>
            </tr>
            <tr>
                <td>Shyam</td>
                <td>21</td>
                <td>74</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td rowspan="2">Total:</td>
                <td colspan="2">Total Students: 2</td>
            </tr>
            <tr>
                <td colspan="2">avg age: 20.5</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
