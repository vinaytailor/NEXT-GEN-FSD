<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <link rel="stylesheet" href="list.css">
</head>
<body>
    <!-- Ordered list -->
    <ol type="A">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Grapes</li>
        <li>Vegetables
            <ul>
                <li>Carrot</li>
                <li>Tomato</li>
                <li>Onion</li>
            </ul>
        </li>
    </ol>

    <!-- Unordered list -->
    <ul>
        <li>Samosa</li>
        <li>Gol-Gappe</li>
        <li>Ice-Cream</li>
    </ul>

    <!-- Description list -->
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets Lorem ipsum dolor sit amet consectetur adipisicing elit.</dd>
    </dl>
</body>
</html>
