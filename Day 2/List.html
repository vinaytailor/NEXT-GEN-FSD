<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        /* Ordered list styling */
        ol {
            background-color: #fff;
            padding: 20px 40px;
            border-left: 4px solid #3498db;
            margin: 20px 0;
            border-radius: 5px;
        }

        ol li {
            margin: 10px 0;
            color: #333;
        }

        /* Unordered list styling */
        ul {
            background-color: #fff;
            padding: 20px 40px;
            border-left: 4px solid #e74c3c;
            margin: 20px 0;
            border-radius: 5px;
        }

        ul li {
            margin: 10px 0;
            color: #333;
        }

        /* Description list styling */
        dl {
            background-color: #fff;
            padding: 20px;
            border-left: 4px solid #2ecc71;
            margin: 20px 0;
            border-radius: 5px;
        }

        dt {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }

        dd {
            margin-left: 20px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Ordered list -->
    <ol type="A">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Grapes</li>
        <li>Vegetables
            <ul>
                <li>Carrot</li>
                <li>Tomato</li>
                <li>Onion</li>
            </ul>
        </li>
    </ol>

    <!-- Unordered list -->
    <ul>
        <li>Samosa</li>
        <li>Gol-Gappe</li>
        <li>Ice-Cream</li>
    </ul>

    <!-- Description list -->
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets Lorem ipsum dolor sit amet consectetur adipisicing elit.</dd>
    </dl>
</body>
</html>
